name: Frontend validation
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
  push:
    branches:
      - 'design/apple-inspired-experience'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit generated web distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/apple-inspired-experience'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web
          if ! git diff --cached --quiet; then
            git commit -m "Build updated Bee Guardian web application"
            git fetch origin design/apple-inspired-experience
            git rebase origin/design/apple-inspired-experience
            git push origin HEAD:design/apple-inspired-experience
          fi
